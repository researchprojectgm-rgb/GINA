 gofirst:"Go to the first pending pair",miss:"Some pairs are still missing. We took you to the first one.",
 nocfg:"Researcher notice: the Google Apps Script URL (ENDPOINT) has not been pasted into the file."});
const CC="AF AL DZ AD AO AG AR AM AU AT AZ BS BH BD BB BY BE BZ BJ BT BO BA BW BR BN BG BF BI CV KH CM CA CF TD CL CN CO KM CG CD CR CI HR CU CY CZ DK DJ DM DO EC EG SV GQ ER EE SZ ET FJ FI FR GA GM GE DE GH GR GD GT GN GW GY HT HN HK HU IS IN ID IR IQ IE IL IT JM JP JO KZ KE KI KW KG LA LV LB LS LR LY LI LT LU MG MW MY MV ML MT MH MR MU MX FM MD MC MN ME MA MZ MM NA NR NP NL NZ NI NE NG KP MK NO OM PK PW PS PA PG PY PE PH PL PT PR QA RO RU RW KN LC VC WS SM ST SA SN RS SC SL SG SK SI SB SO ZA KR SS ES LK SD SR SE CH SY TW TJ TZ TH TL TG TO TT TN TR TM TV UG UA AE GB US UY UZ VU VA VE VN YE ZM ZW".split(" ");

/* ============ ESTADO ============ */
const SC=["VL","L","M","H","VH"],NB=12;
const P=[],PI={};for(let f=0;f<NB;f++)for(let j=0;j<NB;j++)if(f!==j){PI[f+"-"+j]=P.length;P.push([f,j])}
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2);
let S={lang:(navigator.language||"es").startsWith("en")?"en":"es",step:0,cur:0,id:uid(),p:{},o:{},m:{},x:"",sent:false};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const L=()=>S.lang==="es"?1:0,t=k=>U[S.lang][k],pick=s=>s.split("|")[L()];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id),app=$("app");
let showErr=false,tm,tt;
const pErr=i=>{const v=S.p[i];if(!v)return true;return v==="Other"&&!(S.o[i]||"").trim()};
const PQ=[3,2,5,6,4,1,7,8,9];/* cargo, años, educación, país, sector, tamaño, familiaridad, participación IA, consentimiento */
const profileOk=()=>PQ.every(i=>!pErr(i));
const rowMissing=f=>[...Array(NB).keys()].filter(j=>j!==f&&!S.m[f+"-"+j]);
const total=()=>Object.keys(S.m).length;
const nextOpen=from=>{for(let k=1;k<=P.length;k++){const i=(from+k)%P.length;if(!S.m[P[i][0]+"-"+P[i][1]])return i}return -1};

/* ============ RENDER ============ */
function progress(){const pf=PQ.filter(i=>!pErr(i)).length/PQ.length;
 $("pg").style.width=(S.sent?100:pf*10+total()/132*85)+"%";$("ct").textContent=S.step===1?total()+"/132":""}
function render(){
 document.documentElement.lang=S.lang;$("ttl").textContent=t("ttl");$("rs").textContent=t("rs");
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===S.lang));
 $("bk").textContent=t("back");$("bk").style.visibility=(S.step===0||S.sent)?"hidden":"visible";
 const nx=$("nx");nx.disabled=false;nx.textContent=S.step===2?t("send"):t("next");nx.style.display=S.sent?"none":"";
 progress();app.classList.toggle("wide",S.step===1);
 app.innerHTML=S.step===0?vProfile():S.step===1?vMatrix():vFinal();
 if(S.step===1){updFocus();updGrid()}
 window.scrollTo(0,0);
}
function countrySel(bad){
 if(!window.Intl||!Intl.DisplayNames)return `<input type="text" id="p6" data-p="6" value="${esc(S.p[6]||"")}" class="${bad?"err":""}">`;
 const en=new Intl.DisplayNames(["en"],{type:"region"}),lo=new Intl.DisplayNames([S.lang],{type:"region"});
 const a=CC.map(c=>({v:en.of(c),l:lo.of(c)})).sort((x,y)=>x.v==="Peru"?-1:y.v==="Peru"?1:x.l.localeCompare(y.l,S.lang));
 return `<select id="p6" data-p="6" autocomplete="country-name" class="${bad?"err":""}"><option value="">${t("sel")}</option>`+a.map(o=>`<option value="${esc(o.v)}" ${S.p[6]===o.v?"selected":""}>${esc(o.l)}</option>`).join("")+`</select>`;
}
function vProfile(){
 let h=`<h2>${t("hi")}</h2><div class="card"><p>${t("intro")}</p><p class="mut">${t("how")}</p><p class="note">${t("note")}</p></div><div class="card">`;
 for(let n=0;n<PQ.length;n++){const i=PQ[n];
  const bad=showErr&&pErr(i),q=Q[i][L()];
  h+=`<div class="f"><label class="q" for="p${i}">${n+1}. ${q}</label>`;
  if(i===6)h+=countrySel(bad);
  else if(i===9)h+=`<label style="display:flex;gap:.6rem;align-items:flex-start"><input type="checkbox" id="p9" data-c="9" ${S.p[9]?"checked":""} style="margin-top:.35rem;width:1.1rem;height:1.1rem"><span>${Q[9][L()]}</span></label>`;
  else{h+=`<select id="p${i}" data-p="${i}" class="${bad?"err":""}"><option value="">${t("sel")}</option>`+O[i].map(s=>`<option value="${esc(s.split("|")[0])}" ${S.p[i]===s.split("|")[0]?"selected":""}>${esc(pick(s))}</option>`).join("")+`</select>`;
   if(O[i].some(s=>s.startsWith("Other|")))h+=`<div class="o" id="ow${i}" ${S.p[i]==="Other"?"":"hidden"}><input type="text" data-o="${i}" placeholder="${t("other")}" value="${esc(S.o[i]||"")}" aria-label="${t("other")}" class="${bad&&S.p[i]==="Other"?"err":""}"></div>`}
  if(bad)h+=`<div class="em">${t("req")}</div>`;
  h+=`</div>`}
 return h+`</div>`;
}
function vMatrix(){
 return `<h2>${t("mt")}</h2><div class="card"><p style="margin:0">${t("ask2")}</p><p class="note" style="margin:.6rem 0 0">${t("note2")}</p><p class="mut" style="margin:.5rem 0 0">${t("asym")} ${t("tip")}</p></div>
 <div class="mx"><div id="focus" class="card"></div>
 <div class="card gcard"><div class="gtop"><b>${t("grid")}</b><button class="chips" style="border:1px solid var(--line);background:#fff;border-radius:99px;padding:.3rem .8rem;cursor:pointer;font:inherit;font-size:.85rem" data-n="bars">${t("bars")}</button></div><div id="grid"></div></div></div>`;
}
function updFocus(){
 const [f,j]=P[S.cur],v=S.m[f+"-"+j],n=total(),left=132-n;
 const box=(lab,i)=>`<div class="bx"><small class="mut">${lab}</small><div class="tg"><span class="code">F${i+1}</span><b>${pick(B[i][0])}</b></div><div class="mut" style="font-size:.88rem;margin-top:.2rem">${pick(B[i][1])}</div></div>`;
 $("focus").innerHTML=`<div class="mut" style="display:flex;justify-content:space-between;gap:.5rem;font-size:.88rem"><span>${n}/132</span><span>${left?`${t("left2")} ${left} · ≈${Math.max(1,Math.round(left*6/60))} ${t("min")}`:""}</span></div>
 <div class="bar2"><i style="width:${n/132*100}%"></i></div>
 <div class="rows" role="group" aria-label="${t("rowsl")}">${[...Array(NB).keys()].map(r=>`<button type="button" class="rc ${r===f?"cur":""} ${rowMissing(r).length?"":"dn"}" data-r="${r}">F${r+1}</button>`).join("")}</div>
 <div class="qb">${t("q").replace("{a}",`<span class="qc">F${f+1}</span>`).replace("{b}",`<span class="qc">F${j+1}</span>`)}</div>
 <div class="pair">${box(t("fr"),f)}<div class="arw" aria-hidden="true">→</div>${box(t("to"),j)}</div>
 <div class="sc5" role="radiogroup">${SC.map((c,k)=>`<button type="button" role="radio" aria-checked="${v===c}" class="sb v${k} ${v===c?"on":""}" data-v="${c}" title="${esc(t("sc")[c])}"><b>${c}</b><small>${t("w")[c]}</small></button>`).join("")}</div>
 <p class="mut" style="min-height:1.5em;margin:.5rem 0;font-size:.9rem">${v?esc(t("sc")[v]):""}</p>
 <div class="fn"><button class="btn g" data-n="-1">‹ ${t("prev")}</button>${n===132?`<button class="btn" data-n="done">${t("cont")}</button>`:""}</div>`;
}
function updGrid(){
 const [cf,cj]=P[S.cur];
 let h="<i></i>"+[...Array(NB).keys()].map(j=>`<span class="gh ${j===cj?"hl":""}">F${j+1}</span>`).join("");
 for(let f=0;f<NB;f++){h+=`<span class="gh ${f===cf?"hl":""} ${rowMissing(f).length?"":"dn"}">F${f+1}</span>`;
  for(let j=0;j<NB;j++){if(f===j){h+='<span class="gd"></span>';continue}
   const v=S.m[f+"-"+j];
   h+=`<button type="button" class="gc ${v?"c"+SC.indexOf(v):""} ${f===cf&&j===cj?"cur":""}" data-g="${PI[f+"-"+j]}" aria-label="F${f+1} → F${j+1}${v?": "+v:""}">${v||""}</button>`}}
 $("grid").innerHTML=h;
}
function vFinal(){
 const left=132-total();
 if(S.sent)return `<div class="card ok"><h2>${t("okT")}</h2><p>${t("thanks")}</p><p class="mut">${t("okD")}<br><b>${S.id}</b></p><button class="btn g" onclick="backup()">${t("bkp")}</button></div>`;
 let h=`<h2>${t("et")}</h2><div class="card"><label class="q" for="x">${t("ex")}</label><textarea id="x" data-x>${esc(S.x||"")}</textarea></div>`;
 h+=left?`<div class="card warn"><b>${t("left")}: ${left}</b><p><button class="btn g" data-n="first">${t("gofirst")}</button></p></div>`:`<div class="card ok">${t("all")}</div>`;
 if(!profileOk())h+=`<div class="card warn"><button class="btn g" data-n="profile">${t("req")} → ${t("hi")}</button></div>`;
 if(ENDPOINT.startsWith("PEGAR"))h+=`<div class="card warn mut">${t("nocfg")}</div>`;
 if(S.err)h+=`<div class="card warn" role="alert">${t("fail")}</div><button class="btn g" onclick="backup()">${t("bkp")}</button>`;
 return h;
}

/* ============ INTERACCIÓN ============ */
function toast(m){const el=$("toast");el.textContent=m;el.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("on"),1900)}
function go(i){S.cur=i;save();updFocus();updGrid()}
function stepBy(d){return (S.cur+d+P.length)%P.length}
function advance(){return nextOpen(S.cur)}
function setVal(v){
 const [f,j]=P[S.cur],had=rowMissing(f).length===0;
 S.m[f+"-"+j]=v;save();updFocus();updGrid();progress();
 if(!had&&rowMissing(f).length===0)toast(t("mi")+" F"+(f+1)+" "+t("rowdone"));
 clearTimeout(tm);tm=setTimeout(()=>{const n=advance();if(n>=0)go(n);else toast(t("alldone"))},180);
}
app.addEventListener("change",e=>{const d=e.target.dataset;
 if(d.p!==undefined){S.p[d.p]=e.target.value;if(O[d.p]){const w=$("ow"+d.p);if(w)w.hidden=e.target.value!=="Other"}}
 else if(d.c!==undefined)S.p[d.c]=e.target.checked?"Yes, I agree":"";
 save();progress()});
app.addEventListener("input",e=>{const d=e.target.dataset;
 if(d.o!==undefined)S.o[d.o]=e.target.value;else if(d.x!==undefined)S.x=e.target.value;else if(d.p==="6")S.p[6]=e.target.value;save()});
app.addEventListener("click",e=>{
 const v=e.target.closest("[data-v]");if(v){setVal(v.dataset.v);return}
 const g=e.target.closest("[data-g]");if(g){go(+g.dataset.g);$("focus").scrollIntoView({behavior:"smooth",block:"start"});return}
 const r=e.target.closest("[data-r]");if(r){const b=+r.dataset.r*(NB-1);let i=b;for(let k=0;k<NB-1;k++)if(!S.m[P[b+k][0]+"-"+P[b+k][1]]){i=b+k;break}go(i);return}
 const n=e.target.closest("[data-n]");if(!n)return;const k=n.dataset.n;
 if(k==="-1"||k==="1")go(stepBy(+k));
 else if(k==="done"){S.step=2;save();render()}
 else if(k==="first"){S.step=1;S.cur=nextOpen(P.length-1);save();render()}
 else if(k==="profile"){S.step=0;showErr=true;render()}
 else if(k==="bars"){$("dlg").innerHTML=`<table><tbody>`+B.map((b,i)=>`<tr><td><span class="code">F${i+1}</span></td><td><b>${pick(b[0])}</b><br><span class="mut">${pick(b[1])}</span></td></tr>`).join("")+`</tbody></table><p><button class="btn" onclick="document.getElementById('dlg').close()">${t("close")}</button></p>`;$("dlg").showModal()}
});
document.querySelector(".lang").addEventListener("click",e=>{if(e.target.dataset.l){S.lang=e.target.dataset.l;save();render()}});
$("bk").onclick=()=>{S.step=Math.max(0,S.step-1);showErr=false;save();render()};
$("nx").onclick=()=>{
 if(S.step===0){if(!profileOk()){showErr=true;render();const el=document.querySelector(".err");el&&el.scrollIntoView({block:"center"});return}S.step=1;save();render();return}
 if(S.step===1){if(total()<132){go(nextOpen(P.length-1));toast(t("miss"));$("focus").scrollIntoView({behavior:"smooth",block:"start"});return}S.step=2;save();render();return}
 submit();
};
document.addEventListener("keydown",e=>{
 if(S.step!==1||e.ctrlKey||e.metaKey||e.altKey||e.target.matches("input,textarea,select")||$("dlg").open)return;
 if(["1","2","3","4","5"].includes(e.key))setVal(SC[+e.key-1]);
 else if(e.key==="ArrowLeft")go(stepBy(-1));
 else if(e.key==="ArrowRight"){const i=stepBy(1);if(S.m[P[i][0]+"-"+P[i][1]])go(i)}
});

/* ============ ENVÍO ============ */
function payload(){
 const Pr={};for(let i=0;i<10;i++)Pr["P"+(i+1)]=S.p[i]||"";
 for(const i in S.o)if(S.p[i]==="Other")Pr["P"+(+i+1)+"_other"]=S.o[i];
 const J=P.map(([f,j])=>({responseId:S.id,from:"F"+(f+1),to:"F"+(j+1),value:S.m[f+"-"+j]||""}));
 return Object.assign({responseId:S.id,timestamp:new Date().toISOString(),language:S.lang,extraBarrier:S.x||"",judgments:J},Pr);
}
function backup(){
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(payload(),null,2)],{type:"application/json"}));
 a.download="respuesta_"+S.id.slice(0,8)+".json";a.click();
}
async function submit(){
 showErr=true;
 if(!profileOk()){S.step=0;render();return}
 if(total()<132){S.step=1;S.cur=nextOpen(P.length-1);render();return}
 const b=$("nx");b.disabled=true;b.textContent=t("sending");S.err=false;
 try{
  if(ENDPOINT.startsWith("PEGAR"))throw new Error("no endpoint");
  await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(payload())});
  S.sent=true;
 }catch(e){S.err=true}
 save();render();
}
Object.assign(U.es,{how:"Cómo funciona: 1) Su perfil (2 min). 2) Con un toque por par, valore la influencia entre barreras; la encuesta avanza sola. 3) Envíe sus respuestas.",
 note:"Su experiencia es muy valiosa para este estudio. Para que el análisis sea confiable, le invitamos amablemente a completar todas las valoraciones: cada una aporta un dato clave y no se asigna ningún valor por defecto.",
 note2:"Le invitamos a completar todas las valoraciones: cada una es clave para la calidad del estudio.",
 miss:"Aún quedan valoraciones por completar; lo llevamos a la primera pendiente. ¡Gracias!"});
Object.assign(U.en,{how:"How it works: 1) Your profile (2 min). 2) With one tap per pair, rate the influence between barriers; the survey moves on by itself. 3) Submit your answers.",
 note:"Your expertise is highly valuable to this study. For the analysis to be reliable, we kindly invite you to complete all the ratings: each one provides key data and no default value is assigned.",
 note2:"We kindly invite you to complete every rating: each one is key to the quality of the study.",
 miss:"Some ratings are still pending; we took you to the first one. Thank you!"});
Object.assign(U.es,{rs:"Reiniciar",rsq:"¿Borrar todas sus respuestas y volver al inicio? Esta acción no se puede deshacer.",fixed:"fija",rowsl:"Barrera de la fila",fixl:"Mantener fija la barrera de la fila"+"",on:"sí",off:"no"});
Object.assign(U.en,{rs:"Start over",rsq:"Delete all your answers and go back to the start? This cannot be undone.",fixed:"fixed",rowsl:"Row barrier",fixl:"Keep the row barrier fixed",on:"yes",off:"no"});
$("rs").onclick=()=>{if(!confirm(t("rsq")))return;try{localStorage.removeItem(KEY)}catch(e){}
 S={lang:S.lang,step:0,cur:0,fix:true,id:uid(),p:{},o:{},m:{},x:"",sent:false};showErr=false;save();render()};
render();
</script>
</body>
</html>
