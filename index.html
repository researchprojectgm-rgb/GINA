<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GINA · SPSM 5.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14232b;--mut:#51636c;--bg:#eef2f3;--card:#fff;--line:#d3dcdf;--ac:#0f6b6b;--ac2:#0a4d4d;--bad:#b3261e;--r:10px;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Public Sans",system-ui,sans-serif}
h1,h2{font-family:Newsreader,Georgia,serif;line-height:1.2;margin:0 0 .5rem}
h1{font-size:1.5rem}h2{font-size:1.6rem}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:.6rem 1rem}
.hb{max-width:780px;margin:auto;display:flex;gap:.8rem;align-items:center;justify-content:space-between}
.hb b{font-family:Newsreader,serif;font-size:1.05rem;font-weight:600}
.lang button{background:none;border:1px solid #6d868f;color:#fff;padding:.25rem .7rem;cursor:pointer;font:inherit;font-size:.85rem}
.lang button:first-child{border-radius:6px 0 0 6px}.lang button:last-child{border-radius:0 6px 6px 0;border-left:0}
.lang button[aria-pressed=true]{background:#fff;color:var(--ink)}
.bar{height:4px;background:#2c424b}.bar i{display:block;height:100%;background:#5fd0c4;transition:width .3s}
main{max-width:780px;margin:auto;padding:1.2rem 1rem 7rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;margin:.8rem 0}
.mut{color:var(--mut);font-size:.92rem}
label.q{display:block;font-weight:600;margin:.2rem 0 .3rem}
select,input[type=text],textarea{width:100%;font:inherit;padding:.6rem .7rem;border:1px solid #8ea0a7;border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:110px}
.f{margin:0 0 1.1rem}.f .o{margin-top:.5rem}
.err{border-color:var(--bad)!important;box-shadow:0 0 0 2px #b3261e22}
.em{color:var(--bad);font-size:.88rem;margin-top:.25rem}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:.55rem}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:.6rem 0;border:1px solid #8ea0a7;border-radius:8px;font-weight:600;cursor:pointer;background:#fff;user-select:none}
.seg input:checked+span{color:#fff;border-color:transparent}
.seg label:nth-child(1) input:checked+span{background:#6aa7a7}
.seg label:nth-child(2) input:checked+span{background:#3f8d8d}
.seg label:nth-child(3) input:checked+span{background:#1f7474}
.seg label:nth-child(4) input:checked+span{background:#0f5a5a}
.seg label:nth-child(5) input:checked+span{background:#093d3d}
.seg input:focus-visible+span,select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid #f2b233;outline-offset:2px}
.tg{display:flex;align-items:baseline;gap:.5rem}.tg b{font-family:Newsreader,serif;font-size:1.1rem}
.code{background:var(--ac);color:#fff;border-radius:6px;padding:.05rem .45rem;font-weight:600;font-size:.9rem}
.leg{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.85rem;color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:.92rem}td,th{padding:.5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
nav.nv{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:.7rem 1rem}
.nb{max-width:780px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:.8rem}
.btn{font:inherit;font-weight:600;padding:.7rem 1.3rem;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:#fff;cursor:pointer}
.btn:hover{background:var(--ac2)}.btn.g{background:#fff;color:var(--ac)}.btn[disabled]{opacity:.45;cursor:not-allowed}
.ok{border-left:5px solid #2e7d32}.warn{border-left:5px solid #b26a00}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:.2rem .7rem;cursor:pointer;font:inherit;font-size:.85rem}
@media(max-width:520px){.hb b{font-size:.9rem}h2{font-size:1.35rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="hb"><b id="ttl"></b><div class="lang" role="group" aria-label="Language / Idioma"><button data-l="es">ES</button><button data-l="en">EN</button></div></div></header>
<div class="bar" role="progressbar" aria-label="progress"><i id="pg"></i></div>
<main id="app"></main>
<nav class="nv"><div class="nb"><button class="btn g" id="bk"></button><span class="mut" id="ct"></span><button class="btn" id="nx"></button></div></nav>

<script>
/* ============ CONFIGURACIÓN ============ */
const ENDPOINT = "https://docs.google.com/spreadsheets/d/1dWXgJUrJIhfw-gd243usTz6zoBOfxVwQNrm1H6vW3Pw/edit?gid=0#gid=0";
const KEY = "gina_spsm5_v1";

/* ============ CONTENIDO ============ */
const U = {
es:{ttl:"Barreras de IA agéntica en SPSM 5.0",back:"Atrás",next:"Siguiente",send:"Enviar respuestas",
 hi:"Bienvenida y perfil del experto",
 intro:"Agradecemos su participación en esta encuesta anónima. El estudio investiga las barreras que dificultan la adopción de IA agéntica (sistemas autónomos que razonan, planifican y ejecutan decisiones de compra con mínima intervención humana) en la Gestión Sostenible de Compras y Cadena de Suministro (SPSM) 5.0, y cómo se influyen entre sí en redes circulares multinivel. Sus respuestas son confidenciales, se analizarán de forma agregada y solo con fines académicos. Duración aproximada: 25–35 minutos. Su avance se guarda automáticamente en este dispositivo.",
 how:"Cómo funciona: 1) Perfil, 2) Lectura de las 12 barreras, 3) Una pantalla por barrera para valorar su influencia sobre las demás.",
 sel:"Seleccione…",other:"Si eligió “Otro/Other”, especifique",req:"Este campo es obligatorio.",
 bt:"Las 12 barreras",bi:"Lea cada definición. Usará los códigos F1–F12 en la siguiente sección.",
 mi:"Barrera",of:"de",ask:"¿Cuánto intensifica o agrava esta barrera a cada una de las siguientes?",
 asym:"La influencia no es simétrica: el efecto de F1 sobre F2 puede diferir del de F2 sobre F1.",
 miss:"Faltan valoraciones en esta pantalla. Complete las marcadas en rojo.",
 done:"Valoraciones completadas",
 et:"Revisión y envío",ex:"Opcional: ¿hay otra barrera relevante que no esté en la lista? Descríbala.",
 left:"Pendientes",all:"Todas las valoraciones están completas.",
 sending:"Enviando…",okT:"¡Gracias! Sus respuestas fueron enviadas.",okD:"Código de su respuesta (guárdelo por si el investigador lo solicita):",
 bkp:"Descargar copia de seguridad (JSON)",fail:"No se pudo enviar. Revise su conexión y vuelva a intentarlo; sus datos siguen guardados.",
 nocfg:"Aviso para el investigador: falta configurar la URL de Power Automate en el archivo (ENDPOINT).",
 thanks:"Muchas gracias por su tiempo y experiencia. Sus juicios contribuirán a comprender mejor las barreras de la IA agéntica en SPSM 5.0.",
 sc:{VL:"Muy bajo: casi sin efecto directo",L:"Bajo: efecto directo débil",M:"Medio: efecto directo moderado",H:"Alto: efecto directo fuerte",VH:"Muy alto: efecto directo muy fuerte"}},
en:{ttl:"Agentic AI barriers in SPSM 5.0",back:"Back",next:"Next",send:"Submit responses",
 hi:"Welcome and expert profile",
 intro:"We sincerely appreciate your participation in this anonymous survey. This study investigates the barriers that hinder the adoption of Agentic AI (autonomous systems that reason, plan and execute purchasing decisions with limited human intervention) in Sustainable Purchasing and Supply Management (SPSM) 5.0, and how these barriers influence one another across multi-tier, circular supply networks. Responses are confidential, analyzed in aggregate and used exclusively for academic purposes. It takes approximately 25–35 minutes. Your progress is saved automatically on this device.",
 how:"How it works: 1) Profile, 2) Read the 12 barriers, 3) One screen per barrier to rate its influence on the others.",
 sel:"Select…",other:"If “Other”, please specify",req:"This field is required.",
 bt:"The 12 barriers",bi:"Read each definition. You will use codes F1–F12 in the next section.",
 mi:"Barrier",of:"of",ask:"How strongly does this barrier intensify or aggravate each of the following?",
 asym:"Influence is not symmetric: the effect of F1 on F2 may differ from the effect of F2 on F1.",
 miss:"Some ratings on this screen are missing. Complete the ones marked in red.",
 done:"Judgments completed",
 et:"Review and submit",ex:"Optional: is there any additional relevant barrier not listed? Please describe it.",
 left:"Pending",all:"All judgments are complete.",
 sending:"Sending…",okT:"Thank you! Your responses have been submitted.",okD:"Your response code (keep it in case the researcher asks for it):",
 bkp:"Download backup copy (JSON)",fail:"Could not send. Check your connection and try again; your data is still saved.",
 nocfg:"Researcher notice: the Power Automate URL (ENDPOINT) is not configured in the file.",
 thanks:"Thank you very much for your time and expertise. Your judgments will contribute directly to a better understanding of the barriers to Agentic AI adoption in SPSM 5.0.",
 sc:{VL:"Very Low: almost no direct effect",L:"Low: weak direct effect",M:"Medium: moderate direct effect",H:"High: strong direct effect",VH:"Very High: very strong direct effect"}}};

const Q=[["Type of organization","Tipo de organización"],["Size of your organization","Tamaño de su organización"],["Years of experience in purchasing / supply chain management","Años de experiencia en compras / gestión de la cadena de suministro"],["Current position or role","Cargo o rol actual"],["Main sector of your organization","Sector principal de su organización"],["Highest level of education completed","Máximo nivel educativo alcanzado"],["Country where you mainly work","País donde trabaja principalmente"],["Familiarity with AI applications in purchasing and supply chains","Familiaridad con aplicaciones de IA en compras y cadenas de suministro"],["Direct involvement in Agentic AI / AI-based procurement initiatives","Participación directa en iniciativas de IA agéntica / compras basadas en IA"],["I have read the information above and agree to participate voluntarily","He leído la información anterior y acepto participar voluntariamente"]];
const O=[
["Industrial / manufacturing company|Empresa industrial / manufacturera","Retail / distribution company|Empresa de retail / distribución","Logistics and transportation|Logística y transporte","Technology or software provider|Proveedor de tecnología o software","Consulting firm|Consultora","Academia / research institution|Academia / institución de investigación","Government / regulatory body|Gobierno / ente regulador","Other|Otro"],
["Small (1–50 employees)|Pequeña (1–50 empleados)","Medium (51–250 employees)|Mediana (51–250 empleados)","Large (more than 250 employees)|Grande (más de 250 empleados)","Not applicable|No aplica"],
["Less than 2 years|Menos de 2 años","2 to 5 years|2 a 5 años","6 to 10 years|6 a 10 años","11 to 15 years|11 a 15 años","More than 15 years|Más de 15 años"],
["Chief Procurement / Supply Chain Officer|Director de Compras / Cadena de Suministro (CPO/CSCO)","Procurement / Purchasing Manager or Head|Gerente o Jefe de Compras","Category / Sourcing Manager|Gerente de Categoría / Abastecimiento","Supply Chain or Logistics Manager|Gerente de Cadena de Suministro o Logística","Digital Transformation / IT Manager|Gerente de Transformación Digital / TI","Sustainability / ESG Manager|Gerente de Sostenibilidad / ESG","Procurement Analyst or Specialist|Analista o Especialista de Compras","Academic / Researcher|Académico / Investigador","Other|Otro"],
["Manufacturing|Manufactura","Mining and metals|Minería y metales","Energy and utilities|Energía y servicios públicos","Agriculture and agri-food|Agricultura y agroalimentos","Retail and consumer goods|Retail y bienes de consumo","Healthcare and pharmaceuticals|Salud y farmacéutico","Construction and infrastructure|Construcción e infraestructura","Public sector and services|Sector público y servicios","Not applicable (academia / consulting)|No aplica (academia / consultoría)","Other|Otro"],
["Bachelor's / university degree|Grado universitario / licenciatura","Master's degree|Maestría","Doctorate (PhD)|Doctorado (PhD)","Other|Otro"],
null,
["1 – Not familiar|1 – Nada familiarizado","2 – Slightly familiar|2 – Poco familiarizado","3 – Moderately familiar|3 – Moderadamente familiarizado","4 – Very familiar|4 – Muy familiarizado","5 – Expert|5 – Experto"],
["Yes – implemented in operation|Sí – implementada en operación","Yes – pilot or evaluation stage|Sí – etapa piloto o de evaluación","No direct involvement|Sin participación directa"],null];

const B=[
["Data Quality and Fragmentation|Calidad y fragmentación de datos","Inconsistent, siloed, or inaccurate historical spend and supplier data that limits the training precision and reasoning capabilities of self-learning algorithms.|Datos históricos de gasto y proveedores inconsistentes, aislados o inexactos que limitan la precisión del entrenamiento y la capacidad de razonamiento de los algoritmos autoaprendientes."],
["Legacy System Integration|Integración con sistemas heredados","Technical difficulties in establishing seamless, real-time data flows between autonomous agentic platforms and legacy ERP or e-procurement architectures.|Dificultades técnicas para establecer flujos de datos fluidos y en tiempo real entre plataformas agénticas autónomas y arquitecturas ERP o de e-procurement heredadas."],
["Protocol Scarcity and Complexity|Escasez y complejidad de protocolos","The absence of validated, industry-wide standardized protocols and architectural standards for integrating multi-agent systems in procurement.|Ausencia de protocolos y estándares de arquitectura validados y de alcance sectorial para integrar sistemas multiagente en compras."],
["Procurement Skills Shortage|Escasez de habilidades en compras","A critical deficit of purchasing professionals possessing the dual expertise in advanced data analytics and strategic, human-centric negotiation adaptability.|Déficit crítico de profesionales de compras con doble experiencia: analítica avanzada de datos y negociación estratégica, adaptable y centrada en las personas."],
["Organizational Inertia and Low Visibility|Inercia organizacional y baja visibilidad","Bureaucratic internal procurement structures and lack of top management support, leading to inadequate budgets and low strategic priority for digital transformation.|Estructuras burocráticas de compras y falta de apoyo de la alta dirección, que derivan en presupuestos insuficientes y baja prioridad estratégica de la transformación digital."],
["Algorithm Aversion and Resistance|Aversión y resistencia a los algoritmos","Resistance from purchasing managers due to fear of task obsolescence, technology-induced displacement, or psychological distrust of autonomous decision-making.|Resistencia de los gerentes de compras por temor a la obsolescencia de tareas, al desplazamiento por la tecnología o por desconfianza psicológica hacia decisiones autónomas."],
["Supplier Data-Sharing Resistance|Resistencia de proveedores a compartir datos","Suppliers’ reluctance to adopt standardized communication protocols or disclose sensitive operational data within digital spaces (e.g., Catena-X) due to intellectual property concerns.|Reticencia de los proveedores a adoptar protocolos de comunicación estandarizados o a revelar datos operativos sensibles en espacios digitales (p. ej., Catena-X) por temas de propiedad intelectual."],
["Opportunism and Compliance Risks|Oportunismo y riesgos de cumplimiento","Sourcing vulnerabilities where suppliers strategically exploit the rigid, deterministic, or predictable rules of autonomous algorithms to engage in moral hazard.|Vulnerabilidades de abastecimiento en las que los proveedores explotan estratégicamente las reglas rígidas, deterministas o predecibles de los algoritmos autónomos para incurrir en riesgo moral."],
["Supplier Digital Readiness Gaps|Brechas de preparación digital de proveedores","Highly fragmented digital capabilities across the supply base (especially SMEs), preventing synchronized agent-to-agent transactional orchestration.|Capacidades digitales muy fragmentadas en la base de proveedores (especialmente pymes), que impiden la orquestación transaccional sincronizada entre agentes."],
["Liability and Accountability Ambiguity|Ambigüedad de responsabilidad y rendición de cuentas","Legal uncertainty regarding contract validity, operational liability, and accountability when autonomous AI agents execute sourcing transactions without human approval.|Incertidumbre legal sobre la validez contractual, la responsabilidad operativa y la rendición de cuentas cuando agentes de IA ejecutan transacciones de abastecimiento sin aprobación humana."],
["Lack of Transparency and Auditability|Falta de transparencia y auditabilidad","The “black-box” nature of deep-learning algorithms, which conflicts with supply chain transparency, social sustainability auditing, and carbon traceability metrics.|Naturaleza de “caja negra” de los algoritmos de aprendizaje profundo, que choca con la transparencia de la cadena, la auditoría de sostenibilidad social y la trazabilidad de carbono."],
["Cross-Border Data Sovereignty","Soberanía de datos transfronteriza","Complex legal barriers and divergent international regulations (e.g., GDPR) restricting multi-tier, automated supply chain data exchange by autonomous agents.|Barreras legales complejas y regulaciones internacionales divergentes (p. ej., GDPR) que restringen el intercambio automatizado de datos multinivel por agentes autónomos."]];
/* normaliza B: [nombre en|es, desc en|es] */
B[11][0]="Cross-Border Data Sovereignty|Soberanía de datos transfronteriza";B[11][1]=B[11][2];

/* ============ ESTADO ============ */
const SC=["VL","L","M","H","VH"], NB=12, LAST=NB+2;
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2);
let S={lang:(navigator.language||"es").startsWith("en")?"en":"es",step:0,id:uid(),p:{},o:{},m:{},x:"",sent:false};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const L=()=>S.lang==="es"?1:0, t=k=>U[S.lang][k], pick=s=>s.split("|")[L()];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app=document.getElementById("app");
let showErr=false;

/* ============ VALIDACIÓN ============ */
const pErr=i=>{const v=S.p[i];if(!v)return true;if(v==="Other"&&!(S.o[i]||"").trim())return true;return false};
const profileOk=()=>[...Array(10).keys()].every(i=>!pErr(i));
const rowMissing=f=>[...Array(NB).keys()].filter(j=>j!==f&&!S.m[f+"-"+j]);
const total=()=>Object.keys(S.m).length;

/* ============ RENDER ============ */
function render(){
 document.documentElement.lang=S.lang;
 document.getElementById("ttl").textContent=t("ttl");
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===S.lang));
 document.getElementById("pg").style.width=(S.step/LAST*100)+"%";
 document.getElementById("bk").textContent=t("back");
 document.getElementById("bk").style.visibility=(S.step===0||S.sent)?"hidden":"visible";
 const nx=document.getElementById("nx");
 nx.textContent=S.step===LAST?t("send"):t("next");
 nx.style.display=S.sent?"none":"";
 document.getElementById("ct").textContent=S.step>=2&&S.step<=NB+1?total()+"/132":"";
 app.innerHTML=S.step===0?vProfile():S.step===1?vList():S.step<=NB+1?vMatrix(S.step-2):vFinal();
 window.scrollTo(0,0);
}

function vProfile(){
 let h=`<h2>${t("hi")}</h2><div class="card"><p>${t("intro")}</p><p class="mut">${t("how")}</p></div><div class="card">`;
 for(let i=0;i<10;i++){
  const bad=showErr&&pErr(i), q=Q[i][L()];
  h+=`<div class="f"><label class="q" for="p${i}">${i+1}. ${q}</label>`;
  if(i===6)h+=`<input type="text" id="p6" data-p="6" value="${esc(S.p[6]||"")}" autocomplete="country-name" class="${bad?"err":""}">`;
  else if(i===9)h+=`<label style="display:flex;gap:.6rem;align-items:flex-start"><input type="checkbox" id="p9" data-c="9" ${S.p[9]?"checked":""} style="margin-top:.35rem;width:1.1rem;height:1.1rem"><span>${Q[9][L()]}</span></label>`;
  else{h+=`<select id="p${i}" data-p="${i}" class="${bad?"err":""}"><option value="">${t("sel")}</option>`+O[i].map(s=>{const [e]=s.split("|");return `<option value="${esc(e)}" ${S.p[i]===e?"selected":""}>${esc(pick(s))}</option>`}).join("")+`</select>`;
   if(O[i].some(s=>s.startsWith("Other|")))h+=`<div class="o" id="ow${i}" ${S.p[i]==="Other"?"":"hidden"}><input type="text" data-o="${i}" placeholder="${t("other")}" value="${esc(S.o[i]||"")}" aria-label="${t("other")}" class="${bad&&S.p[i]==="Other"?"err":""}"></div>`}
  if(bad)h+=`<div class="em">${t("req")}</div>`;
  h+=`</div>`}
 return h+`</div>`;
}

function vList(){
 return `<h2>${t("bt")}</h2><p class="mut">${t("bi")}</p><div class="card"><table><tbody>`+B.map((b,i)=>`<tr><td><span class="code">F${i+1}</span></td><td><b>${pick(b[0])}</b><br><span class="mut">${pick(b[1])}</span></td></tr>`).join("")+`</tbody></table></div>`;
}

function vMatrix(f){
 const miss=showErr?rowMissing(f):[];
 let h=`<p class="mut" style="margin:0">${t("mi")} ${f+1} ${t("of")} ${NB}</p>
 <div class="card" style="border-top:4px solid var(--ac)"><div class="tg"><span class="code">F${f+1}</span><b>${pick(B[f][0])}</b></div><p class="mut" style="margin:.4rem 0 0">${pick(B[f][1])}</p></div>
 <h2 style="font-size:1.25rem">${t("ask")}</h2><p class="mut" style="margin:0 0 .4rem">${t("asym")}</p>
 <div class="leg">${SC.map(c=>`<span><b>${c}</b> ${t("sc")[c].split(":")[0]}</span>`).join("")}</div>`;
 if(miss.length)h+=`<div class="card warn" role="alert">${t("miss")}</div>`;
 for(let j=0;j<NB;j++){if(j===f)continue;const k=f+"-"+j,bad=miss.includes(j);
  h+=`<fieldset class="card ${bad?"err":""}" style="margin:.6rem 0"><legend style="padding:0 .3rem"><span class="code">F${j+1}</span> <b>${pick(B[j][0])}</b></legend><div class="mut">${pick(B[j][1])}</div><div class="seg">`+SC.map(c=>`<label title="${esc(t("sc")[c])}"><input type="radio" name="m${k}" value="${c}" data-m="${k}" ${S.m[k]===c?"checked":""}><span>${c}</span></label>`).join("")+`</div></fieldset>`}
 return h;
}

function vFinal(){
 const left=132-total();
 if(S.sent)return `<div class="card ok"><h2>${t("okT")}</h2><p>${t("thanks")}</p><p class="mut">${t("okD")}<br><b>${S.id}</b></p><button class="btn g" onclick="backup()">${t("bkp")}</button></div>`;
 let h=`<h2>${t("et")}</h2><div class="card"><label class="q" for="x">${t("ex")}</label><textarea id="x" data-x>${esc(S.x||"")}</textarea></div>`;
 h+=left?`<div class="card warn"><b>${t("left")}: ${left}</b><div class="chips" style="margin-top:.5rem">`+[...Array(NB).keys()].filter(f=>rowMissing(f).length).map(f=>`<button data-go="${f+2}">F${f+1} (${rowMissing(f).length})</button>`).join("")+`</div></div>`:`<div class="card ok">${t("all")}</div>`;
 if(!profileOk())h+=`<div class="card warn"><button class="chips" style="border:0;background:none;cursor:pointer" data-go="0">${t("req")} → ${t("hi")}</button></div>`;
 if(ENDPOINT.startsWith("PEGAR"))h+=`<div class="card warn mut">${t("nocfg")}</div>`;
 if(S.err)h+=`<div class="card warn" role="alert">${t("fail")}</div><button class="btn g" onclick="backup()">${t("bkp")}</button>`;
 return h;
}

/* ============ EVENTOS ============ */
app.addEventListener("change",e=>{const d=e.target.dataset;
 if(d.p!==undefined){S.p[d.p]=e.target.value;if(O[d.p]){const w=document.getElementById("ow"+d.p);if(w)w.hidden=e.target.value!=="Other"}}
 else if(d.c!==undefined)S.p[d.c]=e.target.checked?"Yes, I agree":"";
 else if(d.m)S.m[d.m]=e.target.value;
 save();
 if(d.m){const f=+d.m.split("-")[0];const fs=e.target.closest("fieldset");if(fs&&showErr&&!rowMissing(f).includes(+d.m.split("-")[1]))fs.classList.remove("err");document.getElementById("ct").textContent=total()+"/132"}
});
app.addEventListener("input",e=>{const d=e.target.dataset;
 if(d.o!==undefined)S.o[d.o]=e.target.value;else if(d.x!==undefined)S.x=e.target.value;
 else if(d.p==="6")S.p[6]=e.target.value;save()});
app.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){S.step=+g.dataset.go;showErr=true;save();render()}});
document.querySelector(".lang").addEventListener("click",e=>{if(e.target.dataset.l){S.lang=e.target.dataset.l;save();render()}});
document.getElementById("bk").onclick=()=>{S.step=Math.max(0,S.step-1);showErr=false;save();render()};
document.getElementById("nx").onclick=()=>{
 if(S.step===0&&!profileOk()){showErr=true;render();const el=document.querySelector(".err");el&&el.scrollIntoView({block:"center"});return}
 if(S.step>=2&&S.step<=NB+1&&rowMissing(S.step-2).length){showErr=true;render();const el=document.querySelector(".err");el&&el.scrollIntoView({block:"center"});return}
 if(S.step===LAST){submit();return}
 showErr=false;S.step++;save();render();
};

/* ============ ENVÍO ============ */
function payload(){
 const P={};for(let i=0;i<10;i++)P["P"+(i+1)]=S.p[i]||"";
 for(const i in S.o)if(S.p[i]==="Other")P["P"+(+i+1)+"_other"]=S.o[i];
 const J=[];for(let f=0;f<NB;f++)for(let j=0;j<NB;j++)if(f!==j)J.push({responseId:S.id,from:"F"+(f+1),to:"F"+(j+1),value:S.m[f+"-"+j]||""});
 return Object.assign({responseId:S.id,timestamp:new Date().toISOString(),language:S.lang,extraBarrier:S.x||"",matrix:J.map(r=>r.from+">"+r.to+"="+r.value).join(";"),judgments:J},P);
}
function backup(){
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(payload(),null,2)],{type:"application/json"}));
 a.download="respuesta_"+S.id.slice(0,8)+".json";a.click();
}
async function submit(){
 showErr=true;
 if(!profileOk()){S.step=0;render();return}
 const miss=[...Array(NB).keys()].find(f=>rowMissing(f).length!==0);
 if(miss!==undefined){S.step=miss+2;render();return}
 const b=document.getElementById("nx");b.disabled=true;b.textContent=t("sending");S.err=false;
 try{
  if(ENDPOINT.startsWith("PEGAR"))throw new Error("no endpoint");
  /* text/plain + no-cors evita el preflight CORS; el responseId permite eliminar duplicados */
  await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(payload())});
  S.sent=true;
 }catch(e){S.err=true}
 save();render();
}
render();
</script>
</body>
</html>
